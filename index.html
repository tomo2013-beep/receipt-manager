<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レシート管理 v1.1</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style> *{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#20352b;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:16px}h1{font-size:25px;margin:8px 0}h2{font-size:18px}section{background:white;border:1px solid #dce5df;border-radius:16px;padding:16px;margin:12px 0}button,input,select,textarea{font:inherit;border:1px solid #bbc9c0;border-radius:9px;padding:10px;max-width:100%;min-width:0}button{background:#eaf1ed;color:#234c38;cursor:pointer}button.primary{background:#246b49;color:white;border:0}button:disabled{opacity:.5}input,textarea{background:white;color:#20352b}label{display:block;font-size:13px;color:#52675b;margin:8px 0 3px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}small,.muted{color:#65766c;font-size:13px}.total{font-size:32px;font-weight:750}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 3px;border-bottom:1px solid #e5ebe7;text-align:left}td input,td select{width:100%;padding:7px 4px}td button{padding:7px} .money{text-align:right}.warn{color:#a25417}.ok{color:#246b49}img{max-width:100%;max-height:400px;object-fit:contain}textarea{width:100%;min-height:95px}.hidden{display:none}nav{display:flex;gap:8px}nav button{flex:1}nav .active{background:#246b49;color:white}.scroll{overflow:auto} .items{min-width:490px} .bar{height:7px;background:#e1eae4;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#4e9270}details{margin-top:12px} @media(max-width:520px){main{padding:10px}section{padding:12px}.items{min-width:430px}}</style></head><body><main><h1>レシート管理 <small>v1.1</small></h1><p class="muted">撮影・商品明細・店舗別月間集計</p><nav><button data-tab="dash" class="active">集計</button><button data-tab="entry">登録</button><butt <div id="dash"><section><div class="row"><label>集計月<input id="month" type="month"></label><label>期間<select id="period"><option value="month">月間</option><option value="year">年間</option></select></label></div><p class="muted">支払合計</p><div class="total" id="grand">¥0</div><p id="count" class="muted"></p></section><section><h2>店舗別</h2><div id="stores"></div></section><section><h2>商品別</h2><label>店舗で絞り込み<select id="filter"></select></label><div id="products" class="scroll"></div><p class="muted">商品金額は明細記載額。税・全体値引き等により支払合計とは異なる場合があります。</p></section><section><h2>カテゴリー別</h2><div id="cats"></div></section></div>
<div id="entry" class="hidden"><section><h2>1. レシートを読み取る</h2><div class="row"><label>カメラ<input id="camera" type="file" accept="image/*" capture="environment"></label><label>画像を選択<input id="photo" type="file" accept="image/*"></label></div><img id="preview" class="hidden" alt="レシート原画像"><div id="cropPanel" class="hidden"><p class="muted">レシートの四辺に合わせて範囲を調整してください。背景を除くと精度が上がります。</p><canvas id="cropView" style="width:100%;max-height:420px;object-fit:contain"></canvas><div class="row"><button id="rotateL">左90°回転</button><button id="rotateR">右90°回転</button></div><div class="row"><label>左端<input type="range" id="cl" min="0" max="95" value="0"></label><label>右端<input type="range" id="cr" min="5" max="100" value="100"></label></div><div class="row"><label>上端<input type="range" id="ct" min="0" max="95" value="0"></label><label>下端<input type="range" id="cb" min="5" max="100" value="100"></label></div><label>画像補正<select id="enhance"><option value="gray">白黒・コントラスト強調</option><option value="binary">二値化（文字が薄い場合は白黒推奨）</option><option value="original">補正なし</option></select></label></div><div class="row"><button class="primary" id="scan">文字を読み取る</button><button id="clear">新規入力</button></div><p id="status" class="muted" role="status">初回のOCRには通信が必要です。</p><details><summary>読み取った文字・手入力から解析</summary><textarea id="raw" placeholder="レシートの文字を貼り付けても使えます"></textarea><button id="parse">文字から明細を作成</button></details></section><section><h2>2. 読み取り結果を確認・修正</h2><label>店舗名（同じ店は同じ名前で登録）</label><input id="shop" list="shoplist" placeholder="例：マルナカ" style="width:100%"><datalist id="shoplist"></datalist><label>購入日</label><input type="date" id="date"><div class="scroll"><table class="items"><thead><tr><th>商品名</th><th style="width:52px">数量</th><th style="width:85px">行金額</th><th style="width:100px">分類</th><th></th></tr></thead><tbody id="lines"></tbody></table></div><button id="add">＋ 商品追加</button><div class="row"><label>追加税額<input id="tax" type="number" value="0" step="1"></label><label>全体値引き（正の額）<input id="di 'use strict';const $=id=>document.getElementById(id),key='receipt_manager_v1';let db=[],editing=null,file=null,busy=false;try{db=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(db))db=[]}catch(e){alert('保存データを読み込めませんでした。')};const yen=n=>'¥'+Number(n).toLocaleString('ja-JP'),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const categories=['未分類','食料品','飲料・菓子','日用品','医薬品','その他'];function category(n){if(/牛乳|肉|豚|鶏|卵|たまご|パン|米|野菜|豆腐|魚|キャベツ|ヨーグルト/.test(n))return '食料品';if(/茶|コーヒー|ジュース|菓子|チョコ/.test(n))return '飲料・菓子';if(/洗剤|ティッシュ|石鹸|シャンプー|トイレット/.test(n))return '日用品';return '未分類'}function tab(n){for(const k of ['dash','entry','history'])$(k).classList.toggle('hidden',k!==n);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));if(n!=='entry')render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function add(x={name:'',qty:1,amount:'',category:'未分類'}){let tr=document.createElement('tr');tr.innerHTML=`<td><input aria-label="商品名" class="name" value="${esc(x.name)}"></td><td><input aria-label="数量" class="qty" type="number" min="1" step="1" value="${esc(x.qty)}"></td><td><input aria-label="行金額" class="amount" type="number" step="1" value="${esc(x.amount)}"></td><td><select aria-label="分類">${categories.map(c=>`<option ${c===x.category?'selected':''}>${c}</option>`).join('')}</select></td><td><button type="button" aria-label="削除">×</button></td>`;tr.querySelector('button').onclick=()=>{tr.remove();changed()};tr.querySelector('.name').addEventListener('change',()=>{let s=tr.querySelector('select');if(s.value==='未分類')s.value=category(tr.querySelector('.name').value)});$('lines').append(tr)}function lines(){return [...$('lines').rows].map(r=>({name:r.querySelector('.name').value.trim(),qty:Num mageData(im,0,0);return o}for(let id of ['camera','photo'])$(id).onchange=e=>{if(busy)return;file=e.target.files[0];if(!file)return;if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(file);$('preview').src=imageUrl;$('preview').classList.remove('hidden');source=null;$('cropPanel').classList.add('hidden');let img=new Image();img.onload=()=>{if(img.src!==imageUrl)return;source=img;angle=0;resetCrop();$('cropPanel').classList.remove('hidden');cropPreview();$('preview').classList.add('hidden');$('status').textContent='緑枠をレシートに合わせてから読み取ってください。'};img.onerror=()=>{$('status').textContent='画像を開けません。JPEGまたはPNGで試してください。'};img.src=imageUrl;$('verified').checked=false};function normalize(s){return s.normalize('NFKC').replace(/[￥¥]/g,'¥')}function parse(){let a=normalize($('raw').value).split(/\n/).map(x=>x.trim()).filter(Boolean);if(!a.length)return;let shop=a.find(x=>/マルナカ|コスモス|イオン|セブン|ローソン|ファミリーマート|ハローズ|ゆめタウン|スーパー/.test(x))||a.slice(0,5).find(x=>x.length<=30&&/店|株式会社|商店|市場|薬局|ドラッグ|食堂/.test(x)&&!/領収|レシート|電話|登録番号|会員/.test(x));let date=a.join(' ').match(/(20\d{2})\s*[年/.-]\s*(\d{1,2})\s*[月/.-]\s*(\d{1,2})/);$('shop').value=shop||'';$('date').value=date?`${date[1]}-${date[2].padStart(2,'0')}-${date[3].padStart(2,'0')}`:'';if(!validDate($('date').value))$('date').value='';$('lines').innerHTML='';$('paid').value='';$('tax').value=0;$('discount').value=0;let rejected=0;let tax=0,disc=0,paid=null,subtotal=null;for(let s of a){let m=s.match(/(?:[¥]\s*)?([-−]?\d[\d,]*)\s*円?\s*[*※]?$/);if(!m)continue;let n=Number(m[1].replace(/,/g,'').replace('−','-'));if(!validMoney(n)||m[1].replace(/[^0-9]/g,'').length>7){rejected++;continue}let name=s.slice(0,m.index).trim().replace(/[¥\s]+$/,'');if(/小計/.test(name)){subtotal=n;continue}if(/合計|お買上金額|お支払金額/.test(name)&&!/税|点数|値引|対象|内訳|累計/.test(name)){paid=n;continue}if(/外税|^消費税$/.test(name)&&! /内税|うち/.test(name)){tax+=n;continue}if(/値引|割引|クーポン/.test(name)){disc+=Math.abs(n);continue}if(name.length>60||!name||name===shop||/税|対象|預|釣|釣 +@\-]/.test(s)&&typeof x==='string')s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}$('csv').onclick=()=>download('receipt_items_'+today()+'.csv','\ufeff'+[['日付','店舗','商品','数量','行金額','分類','レシートID'],...db.flatMap(r=>r.items.map(x=>[r.date,r.shop,x.name,x.qty,x.amount,x.category,r.id]))].map(a=>a.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');$('restore').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text()),a=obj.records;if(obj.version!==1||!Array.isArray(a)||a.some(r=>!r||typeof r.id!=='string'||typeof r.shop!=='string'||typeof r.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||![r.paid,r.tax,r.discount].every(Number.isSafeInteger)||!Array.isArray(r.items)||r.items.some(x=>!x||typeof x.name!=='string'||!Number.isSafeInteger(x.amount)||!Number.isSafeInteger(x.qty)||x.qty<1||!categories.includes(x.category))))throw Error('形式が不正です');let m=new Map(db.map(r=>[r.id,r]));for(let r of a)if(!m.has(r.id))m.set(r.id,r);if(confirm('バックアップから '+(m.size-db.length)+' 件追加しますか？')&&persist([...m.values()]))render()}catch(err){alert('復元失敗：'+err.message)}finally{e.target.value=''}};$('date').max=today();$('month').value=today().slice(0,7);reset();render();</script></body></html>
